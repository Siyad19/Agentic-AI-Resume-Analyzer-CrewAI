[project]
name = "resume_analyzer_agent"
version = "0.1.0"
description = "resume-analyzer-agent using crewAI"
authors = [{ name = "Siyad S", email = "siyad1911@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7"
]

[project.scripts]
resume_analyzer_agent = "resume_analyzer_agent.main:run"
run_crew = "resume_analyzer_agent.main:run"
train = "resume_analyzer_agent.main:train"
replay = "resume_analyzer_agent.main:replay"
test = "resume_analyzer_agent.main:test"
run_with_trigger = "resume_analyzer_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
